[build]
  publish = "."

# Landing-page mode: every path serves the status page.
# The original pages stay in the repo but are not reachable while this rule is active.
# To restore the site, delete this block (or revert the commit that added it).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"
